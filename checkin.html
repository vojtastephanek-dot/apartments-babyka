<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online check-in · Apartments Babyka</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 30V14H9v-3h14v3h-2v16zM12.5 11V7h7v4zM12 7c0-2.5 2-4 4-5c2 1 4 2.5 4 5z" fill="currentColor"/></svg><span><b>Babyka</b><small>Apartments · Český Krumlov</small></span></a>
    <div class="nav-links">
      <a href="index.html#apartmany" data-i18n="nav.rooms"></a>
      <a href="index.html#rezervace" data-i18n="nav.book"></a>
      <a href="checkin.html" data-i18n="nav.checkin"></a>
      <a href="#kontakt" data-i18n="nav.contact"></a>
      <div class="lang-switch"><button data-lang="cs">CZ</button><button data-lang="en">EN</button><button data-lang="de">DE</button></div>
    </div>
    <button class="nav-toggle" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</nav>

<header class="page-head">
  <div class="wrap narrow">
    <div class="kicker">Apartments Babyka</div>
    <h1 data-i18n="ci.title"></h1>
    <p data-i18n="ci.intro"></p>
  </div>
</header>

<section style="padding-top:48px">
  <div class="wrap narrow">
    <div class="msg ok hidden" id="ci-done" data-i18n="ci.done" style="font-size:1.05rem;padding:22px"></div>

    <form id="ci-form" class="panel" novalidate>
      <div class="row three">
        <label><span data-i18n="ci.reservation"></span><input name="reservation" id="f-reservation" required></label>
        <label><span data-i18n="ci.arrivalTime"></span><input type="time" name="arrivalTime" required></label>
        <label><span data-i18n="ci.car"></span><input name="car"></label>
      </div>

      <div id="guests"></div>
      <button type="button" class="btn ghost block" id="add-guest" data-i18n="ci.addGuest" style="color:var(--vltava);margin-bottom:22px"></button>

      <label><span data-i18n="ci.note"></span><textarea name="note"></textarea></label>
      <div class="msg err hidden" id="ci-err"></div>
      <label class="check"><input type="checkbox" required><span data-i18n="ci.gdpr"></span></label>
      <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
      <button class="btn block" type="submit" id="ci-submit" data-i18n="ci.submit"></button>
    </form>
  </div>
</section>

<footer id="kontakt">
  <div class="wrap">
    <div class="cols">
      <div>
        <h4>Apartments Babyka</h4>
        <p data-c="contact.address"></p>
        <p><a class="map-link" target="_blank" rel="noopener">Mapy.cz →</a></p>
      </div>
      <div>
        <h4 data-i18n="nav.contact"></h4>
        <p><a data-c="contact.email" data-href="mailto:{}"></a></p>
        <p><a data-c="contact.phone" data-href="tel:{}"></a></p>
      </div>
      <div>
        <h4>Info</h4>
        <p>Check-in <span data-c="checkInTime"></span> · Check-out <span data-c="checkOutTime"></span></p>
        <p><a href="checkin.html" data-i18n="nav.checkin"></a></p>
        <p><a href="gdpr.html">GDPR</a></p>
      </div>
    </div>
    <div class="bottom">© <span id="year"></span> Apartments Babyka. <span data-i18n="footer.rights"></span></div>
  </div>
</footer>

<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/common.js"></script>
<script src="assets/checkin.js"></script>
</body>
</html>
