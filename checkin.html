<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <a class="brand" href="index.html"><svg viewBox="8 0 16 32" aria-hidden="true"><rect x="12" y="22" width="8" height="10" fill="#e6d4a0"/><path d="M12 24h4v2h-4zM16 26h4v2h-4zM12 28h4v2h-4zM16 22h4v2h-4z" fill="#e2b3a6"/><rect x="12" y="16" width="8" height="6" fill="#dfae9f"/><rect x="11.5" y="14.6" width="9" height="1.6" fill="#efe3cc"/><rect x="12" y="11.6" width="8" height="3" fill="#efe3cc"/><path d="M13 14.6v-1.6a.7.7 0 0 1 1.4 0v1.6zM15.3 14.6v-1.6a.7.7 0 0 1 1.4 0v1.6zM17.6 14.6v-1.6a.7.7 0 0 1 1.4 0v1.6z" fill="#7a2d1f"/><path d="M10.6 11.8L12 10.2h8l1.4 1.6z" fill="#3f6657"/><rect x="12.8" y="7.6" width="6.4" height="2.7" fill="#efe3cc"/><path d="M12.6 7.8c.6-1.8 2.4-2.2 2.7-3.2h1.4c.3 1 2.1 1.4 2.7 3.2z" fill="#5e8b78"/><rect x="15" y="3" width="2" height="1.7" fill="#efe3cc"/><path d="M14.6 3.2c-.3-1 .6-1.5 1.4-2c.8.5 1.7 1 1.4 2z" fill="#5e8b78"/><circle cx="16" cy=".9" r=".6" fill="#e9c98c"/></svg><span><b>Babyka</b><small>Apartments · Český Krumlov</small></span></a>
    <div class="nav-links">
      <a href="index.html#apartmany" data-i18n="nav.rooms"></a>
      <a href="index.html#rezervace" data-i18n="nav.book"></a>
      <a href="checkin.html" data-i18n="nav.checkin"></a>
      <a href="#kontakt" data-i18n="nav.contact"></a>
      <div class="lang-switch"><button data-lang="cs">CZ</button><button data-lang="en">EN</button><button data-lang="de">DE</button></div>
    </div>
    <button class="nav-toggle" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</nav>

<header class="page-head">
  <div class="wrap narrow">
    <div class="kicker">Apartments Babyka</div>
    <h1 data-i18n="ci.title"></h1>
    <p data-i18n="ci.intro"></p>
  </div>
</header>

<section style="padding-top:48px">
  <div class="wrap narrow">
    <div class="msg ok hidden" id="ci-done" data-i18n="ci.done" style="font-size:1.05rem;padding:22px"></div>

    <form id="ci-form" class="panel" novalidate>
      <div class="source-switch" role="radiogroup">
        <span data-i18n="ci.source"></span>
        <label><input type="radio" name="source" value="web" checked><span data-i18n="ci.source.web"></span></label>
        <label><input type="radio" name="source" value="booking"><span>Booking.com</span></label>
      </div>
      <div class="row three">
        <label><span id="l-reservation" data-i18n="ci.reservation"></span><input name="reservation" id="f-reservation" required inputmode="numeric"></label>
        <label><span data-i18n="ci.arrivalTime"></span><input type="time" name="arrivalTime" required></label>
        <label><span data-i18n="ci.car"></span><input name="car"></label>
      </div>
      <div class="row hidden" id="stay-dates">
        <label><span data-i18n="book.arrival"></span><input type="date" name="arrival" id="f-arr"></label>
        <label><span data-i18n="book.departure"></span><input type="date" name="departure" id="f-dep"></label>
      </div>
      <p class="hint hidden" id="booking-hint" data-i18n="ci.bookingHint"></p>

      <div id="guests"></div>
      <button type="button" class="btn ghost block" id="add-guest" data-i18n="ci.addGuest" style="color:var(--vltava);margin-bottom:22px"></button>

      <label><span data-i18n="ci.note"></span><textarea name="note"></textarea></label>
      <div class="msg err hidden" id="ci-err"></div>
      <label class="check"><input type="checkbox" required><span data-i18n="ci.gdpr"></span></label>
      <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
      <button class="btn block" type="submit" id="ci-submit" data-i18n="ci.submit"></button>
    </form>
  </div>
</section>

<footer id="kontakt">
  <div class="wrap">
    <div class="cols">
      <div>
        <h4>Apartments Babyka</h4>
        <p data-c="contact.address"></p>
        <p><a class="map-link" target="_blank" rel="noopener">Mapy.cz →</a></p>
      </div>
      <div>
        <h4 data-i18n="nav.contact"></h4>
        <p><a data-c="contact.email" data-href="mailto:{}"></a></p>
        <p><a data-c="contact.phone" data-href="tel:{}"></a></p>
      </div>
      <div>
        <h4>Info</h4>
        <p>Check-in <span data-c="checkInTime"></span> · Check-out <span data-c="checkOutTime"></span></p>
        <p><a href="checkin.html" data-i18n="nav.checkin"></a></p>
        <p><a href="gdpr.html">GDPR</a></p>
      </div>
    </div>
    <div class="bottom">© <span id="year"></span> Apartments Babyka. <span data-i18n="footer.rights"></span></div>
  </div>
</footer>

<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/common.js"></script>
<script src="assets/checkin.js"></script>
</body>
</html>
