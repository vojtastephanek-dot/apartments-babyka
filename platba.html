<script>
  // platba.html?r=ID&vs=VS&am=CASTKA&due=YYYY-MM-DD
  (function () {
    const q = new URLSearchParams(location.search);
    const data = { id: q.get("r") || "", vs: q.get("vs") || q.get("r") || "", amount: +q.get("am") || 0, due: q.get("due") || "" };
    const draw = () => BabykaPay.render(document.getElementById("pay"), data);
    Babyka.initChrome();
    draw();
    document.addEventListener("langchange", draw);
  })();
</script>
