  <div class="wrap about-grid">
    <div class="reveal">
      <div class="kicker">Široká · Český Krumlov</div>
      <h2 data-i18n="about.title"></h2>
      <p class="lead" data-i18n="about.text"></p>
    </div>
    <ul class="features reveal">
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span data-i18n="about.f1"></span></li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11h16M6 11V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M5 11v8h14v-8"/><circle cx="9" cy="15" r="1"/><circle cx="15" cy="15" r="1"/></svg><span data-i18n="about.f2"></span></li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h16v2a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-2zM6 12V6a2 2 0 0 1 4 0M7 19l-1 2M17 19l1 2"/></svg><span data-i18n="about.f3"></span></li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span data-i18n="about.f4"></span></li>
    </ul>
  </div>
</section>

<section id="apartmany" class="rooms">
  <div class="wrap">
    <div class="kicker">Apartments Babyka</div>
    <h2 data-i18n="rooms.title"></h2>
    <div class="room-grid" id="room-grid"></div>
  </div>
</section>

<section id="rezervace">
  <div class="wrap">
    <div class="kicker" data-i18n="nav.book"></div>
    <h2 data-i18n="cal.title"></h2>

    <div class="book-grid">
      <div class="panel">
        <div class="room-tabs" id="room-tabs"></div>
        <div id="calendar"><div class="cal-loading" data-i18n="cal.loading"></div></div>
        <div class="cal-legend">
          <span><i style="background:#fff;border:1px solid var(--line)"></i><span data-i18n="cal.free"></span></span>
          <span><i style="background:var(--busy)"></i><span data-i18n="cal.busy"></span></span>
          <span><i style="background:var(--vltava)"></i><span data-i18n="book.arrival"></span> / <span data-i18n="book.departure"></span></span>
        </div>
      </div>

      <div class="panel" id="book-panel">
        <h3 data-i18n="book.title"></h3>
        <form id="book-form" novalidate>
          <label><span data-i18n="book.room"></span><select name="room" id="f-room" required></select></label>
          <div class="row">
            <label><span data-i18n="book.arrival"></span><input type="date" name="arrival" id="f-arrival" required></label>
            <label><span data-i18n="book.departure"></span><input type="date" name="departure" id="f-departure" required></label>
          </div>
          <div class="row">
            <label><span data-i18n="book.adults"></span><input type="number" name="adults" id="f-adults" min="1" value="2" required></label>
            <label><span data-i18n="book.children"></span><input type="number" name="children" id="f-children" min="0" value="0"></label>
          </div>
          <label><span data-i18n="book.name"></span><input name="name" autocomplete="name" required></label>
          <div class="row">
            <label><span data-i18n="book.email"></span><input type="email" name="email" autocomplete="email" required></label>
            <label><span data-i18n="book.phone"></span><input type="tel" name="phone" autocomplete="tel" required></label>
          </div>
          <label><span data-i18n="book.note"></span><textarea name="note"></textarea></label>

          <div class="summary hidden" id="summary"></div>
          <div class="msg err hidden" id="book-err"></div>
          <label class="check"><input type="checkbox" name="gdpr" required><span data-i18n="book.gdpr"></span></label>
          <!-- past na spamboty: skryté pole, člověk ho nevyplní -->
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
          <button class="btn block" type="submit" id="book-submit" data-i18n="book.submit"></button>
        </form>

        <div id="pay" class="hidden"></div>
      </div>
    </div>
  </div>
</section>

<section class="direct">
  <div class="wrap">
    <div>
      <h2 data-i18n="direct.title"></h2>
      <p data-i18n="direct.text"></p>
    </div>
    <a class="btn ghost" href="checkin.html" style="color:#f3eadb" data-i18n="nav.checkin"></a>
  </div>
</section>

<footer id="kontakt">
  <div class="wrap">
    <div class="cols">
      <div>
        <h4>Apartments Babyka</h4>
        <p data-c="contact.address"></p>
        <p><a class="map-link" target="_blank" rel="noopener">Mapy.cz →</a></p>
      </div>
      <div>
        <h4 data-i18n="nav.contact"></h4>
        <p><a data-c="contact.email" data-href="mailto:{}"></a></p>
        <p><a data-c="contact.phone" data-href="tel:{}"></a></p>
      </div>
      <div>
        <h4>Info</h4>
        <p>Check-in <span data-c="checkInTime"></span> · Check-out <span data-c="checkOutTime"></span></p>
        <p><a href="checkin.html" data-i18n="nav.checkin"></a></p>
        <p><a href="gdpr.html">GDPR</a></p>
      </div>
    </div>
    <div class="bottom">© <span id="year"></span> Apartments Babyka. <span data-i18n="footer.rights"></span></div>
  </div>
</footer>
