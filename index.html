<section id="apartmany" class="rooms">

<section id="rezervace">
  <div class="wrap">
    <div class="kicker" data-i18n="nav.book"></div>
    <h2 data-i18n="cal.title"></h2>

    <div class="book-grid">
      <div class="panel">
        <div class="room-tabs" id="room-tabs"></div>
        <div id="calendar"><div class="cal-loading" data-i18n="cal.loading"></div></div>
        <div class="cal-legend">
          <span><i style="background:#fff;border:1px solid var(--line)"></i><span data-i18n="cal.free"></span></span>
          <span><i style="background:var(--busy)"></i><span data-i18n="cal.busy"></span></span>
          <span><i style="background:var(--vltava)"></i><span data-i18n="book.arrival"></span> / <span data-i18n="book.departure"></span></span>
        </div>
      </div>

      <div class="panel" id="book-panel">
        <h3 data-i18n="book.title"></h3>
        <form id="book-form" novalidate>
          <label><span data-i18n="book.room"></span><select name="room" id="f-room" required></select></label>
          <div class="row">
            <label><span data-i18n="book.arrival"></span><input type="date" name="arrival" id="f-arrival" required></label>
            <label><span data-i18n="book.departure"></span><input type="date" name="departure" id="f-departure" required></label>
          </div>
          <div class="row">
            <label><span data-i18n="book.adults"></span><input type="number" name="adults" id="f-adults" min="1" value="2" required></label>
            <label><span data-i18n="book.children"></span><input type="number" name="children" id="f-children" min="0" value="0"></label>
          </div>
          <label><span data-i18n="book.name"></span><input name="name" autocomplete="name" required></label>
          <div class="row">
            <label><span data-i18n="book.email"></span><input type="email" name="email" autocomplete="email" required></label>
            <label><span data-i18n="book.phone"></span><input type="tel" name="phone" autocomplete="tel" required></label>
          </div>
          <label><span data-i18n="book.note"></span><textarea name="note"></textarea></label>

          <div class="summary hidden" id="summary"></div>
          <div class="msg err hidden" id="book-err"></div>
          <label class="check"><input type="checkbox" name="gdpr" required><span data-i18n="book.gdpr"></span></label>
          <!-- past na spamboty: skryté pole, člověk ho nevyplní -->
          <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
          <button class="btn block" type="submit" id="book-submit" data-i18n="book.submit"></button>
        </form>

        <div id="pay" class="hidden"></div>
      </div>
    </div>
  </div>
</section>
